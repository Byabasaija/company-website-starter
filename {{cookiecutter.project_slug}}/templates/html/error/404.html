{% extends 'base.html' %}
{% load static %}

{% block title %}Page Not Found{% endblock %}

{% block content %}
<section class="section-padding min-h-[calc(100vh-4rem)] flex items-center justify-center">
    <div class="text-center max-w-md mx-auto">
        <img src="{% static './assets/images/404.png' %}" alt="404" class="max-h-64 mx-auto mb-8">
        <h1 class="text-3xl font-bold text-gray-900 mb-3">Page Not Found</h1>
        <p class="text-gray-500 mb-8">Sorry, the page you're looking for doesn't exist or has been moved.</p>
        <a href="{% url 'home' %}" class="btn-primary inline-flex items-center gap-2">
            Go Home <i class="bi bi-arrow-right"></i>
        </a>
    </div>
</section>
{% endblock %}
