{% extends 'base.html' %}
{% load static %}

{% block title %}Too Many Requests{% endblock %}

{% block content %}
<section class="section-padding min-h-[calc(100vh-4rem)] flex items-center justify-center">
    <div class="text-center max-w-md mx-auto">
        <img src="{% static './assets/images/ratelimiter-doggy.png' %}" alt="429"
             class="max-h-64 mx-auto mb-8">
        <h1 class="text-3xl font-bold text-gray-900 mb-3">Too Many Requests</h1>
        <p class="text-gray-500 mb-8">Whoa, slow down! You've made too many requests. Please wait a moment and try again.</p>
        <a href="{% url 'home' %}" class="btn-primary inline-flex items-center gap-2">
            Go Home <i class="bi bi-arrow-right"></i>
        </a>
    </div>
</section>
{% endblock %}
