{% extends 'base.html' %}
{% load static %}

{% block title %}{{ title }}{% endblock %}
{% block description %}{{ title }}{% endblock %}

{% block content %}
<section class="section-padding min-h-[calc(100vh-4rem)] flex items-center justify-center">
    <div class="text-center max-w-md mx-auto">
        <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
            <i class="bi bi-check-circle text-3xl text-green-600"></i>
        </div>
        <h1 class="text-3xl font-bold text-gray-900 mb-4">{{ title }}</h1>
        <p class="text-gray-600 mb-8">{{ description }}</p>
        <a href="{% url 'home' %}" class="btn-primary inline-flex items-center gap-2">
            Go Home <i class="bi bi-arrow-right"></i>
        </a>
    </div>
</section>
{% endblock %}
