{% if services %}
<section class="section-padding bg-surface overflow-hidden">
    <div class="max-w-7xl mx-auto">
        <div class="text-center mb-16 reveal">
            <span class="section-label">What We Offer</span>
            <h2 class="section-title mt-2">Our Services</h2>
        </div>
        {% for service in services %}
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center {% if not forloop.last %}mb-20{% endif %}">
            {% if forloop.counter|divisibleby:2 %}
            <div class="order-last lg:order-first reveal-left" data-delay="{{ forloop.counter0 }}">
            {% else %}
            <div class="reveal-right" data-delay="{{ forloop.counter0 }}">
            {% endif %}
                <div class="w-16 h-16 rounded-2xl bg-primary/8 flex items-center justify-center mb-6">
                    <i class="bi {{ service.icon }} text-3xl text-primary"></i>
                </div>
                <h3 class="text-2xl font-bold text-gray-900 mb-4">{{ service.title }}</h3>
                <div class="text-gray-600 leading-relaxed text-lg">{{ service.description|safe }}</div>
            </div>
            <div class="{% if forloop.counter|divisibleby:2 %}order-first lg:order-last reveal-right{% else %}reveal-left{% endif %} rounded-3xl bg-gradient-to-br from-primary/10 to-secondary/10 h-64 lg:h-80 flex items-center justify-center"
                 data-delay="{{ forloop.counter0 }}">
                <i class="bi {{ service.icon }} text-8xl text-primary/20"></i>
            </div>
        </div>
        {% endfor %}
    </div>
</section>
{% endif %}
