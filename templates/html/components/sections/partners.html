{% if partners %}
<section class="section-padding bg-white border-y border-gray-100">
    <div class="max-w-6xl mx-auto">
        <p class="text-center text-xs font-bold uppercase tracking-widest text-gray-400 mb-8">
            Trusted By & Our Partners
        </p>
        <div class="flex flex-wrap justify-center items-center gap-10">
            {% for partner in partners %}
            {% if partner.website_url %}
            <a href="{{ partner.website_url }}" target="_blank" rel="noopener noreferrer"
               class="grayscale opacity-50 hover:grayscale-0 hover:opacity-100 transition-all duration-300">
                <img src="{{ partner.logo.url }}" alt="{{ partner.name }}" class="h-10 w-auto object-contain">
            </a>
            {% else %}
            <img src="{{ partner.logo.url }}" alt="{{ partner.name }}"
                 class="h-10 w-auto object-contain grayscale opacity-50">
            {% endif %}
            {% endfor %}
        </div>
    </div>
</section>
{% endif %}
