{% if team_members %}
<section class="section-padding bg-white">
    <div class="max-w-7xl mx-auto">
        <div class="text-center mb-12">
            <span class="section-label">The Team</span>
            <h2 class="section-title mt-2">Our People</h2>
        </div>
        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6">
            {% for member in team_members %}
            <div class="flex flex-col items-center text-center group">
                {% if member.photo %}
                    <img src="{{ member.photo.url }}" alt="{{ member.name }}"
                         class="w-20 h-20 rounded-full object-cover shadow-sm ring-2 ring-transparent group-hover:ring-primary/30 transition-all duration-300 mb-3">
                {% else %}
                    <div class="w-20 h-20 rounded-full bg-primary/8 flex items-center justify-center mb-3 group-hover:bg-primary/12 transition-colors">
                        <i class="bi bi-person text-3xl text-primary/40"></i>
                    </div>
                {% endif %}
                <h3 class="font-semibold text-gray-900 text-sm group-hover:text-primary transition-colors">{{ member.name }}</h3>
                <p class="text-primary text-xs mt-0.5">{{ member.role }}</p>
                <div class="flex gap-2 mt-2 text-gray-300 text-sm">
                    {% if member.linkedin %}<a href="{{ member.linkedin }}" target="_blank" rel="noopener noreferrer" class="hover:text-primary transition-colors"><i class="bi bi-linkedin"></i></a>{% endif %}
                    {% if member.twitter %}<a href="{{ member.twitter }}" target="_blank" rel="noopener noreferrer" class="hover:text-primary transition-colors"><i class="bi bi-twitter-x"></i></a>{% endif %}
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
{% endif %}
