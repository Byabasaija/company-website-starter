{% if services %}
<section class="section-padding bg-white">
    <div class="max-w-5xl mx-auto">
        <div class="text-center mb-14">
            <span class="section-label">What We Offer</span>
            <h2 class="section-title mt-2">Our Services</h2>
        </div>
        <div class="divide-y divide-gray-100">
            {% for service in services %}
            <div class="flex items-start gap-8 py-10 group">
                <div class="shrink-0 w-14 h-14 rounded-2xl bg-primary/8 flex items-center justify-center group-hover:bg-primary group-hover:text-white transition-colors duration-300">
                    <i class="bi {{ service.icon }} text-2xl text-primary group-hover:text-white transition-colors duration-300"></i>
                </div>
                <div class="flex-1">
                    <div class="flex items-baseline gap-4">
                        <span class="text-4xl font-bold text-gray-100 font-serif leading-none select-none">
                            {{ forloop.counter|stringformat:"02d" }}
                        </span>
                        <h3 class="text-xl font-bold text-gray-900 group-hover:text-primary transition-colors">{{ service.title }}</h3>
                    </div>
                    <div class="mt-3 text-gray-600 leading-relaxed max-w-2xl">{{ service.description|safe }}</div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
{% endif %}
